<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tulas International School | CBSE Boarding &amp; Day School in Dehradun</title>
    <meta
      name="description"
      content="Tulas International School (TIS) is a co-educational CBSE boarding and day school in Dehradun, Uttarakhand. A homepage redesign concept."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" href="https://tis.edu.in/_next/static/media/schoolLogo.95f6e121.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Instrument+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var theme = "light";
        try {
          var stored = localStorage.getItem("tis-theme");
          if (stored === "light" || stored === "dark") {
            theme = stored;
          } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            theme = "dark";
          }
        } catch (error) {
          theme = "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
